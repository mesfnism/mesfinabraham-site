<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' role='img'><rect width='1200' height='800' fill='#EAF2FA'/><text x='60' y='90' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='56' font-weight='700' fill='#12263A' text-anchor='start'>EthioGTS</text><rect x='60.0' y='140' width='520.0' height='250' rx='16' fill='#FFFFFF' stroke='#B9CBDD' stroke-width='3'/><rect x='60.0' y='140' width='12' height='250' rx='6' fill='#0B6FC4'/><text x='100.0' y='210' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='#12263A' text-anchor='start'>1  Find</text><text x='100.0' y='270.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>Tracer studies from</text><text x='100.0' y='311.6' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>Ethiopian institutions</text><rect x='620.0' y='140' width='520.0' height='250' rx='16' fill='#FFFFFF' stroke='#B9CBDD' stroke-width='3'/><rect x='620.0' y='140' width='12' height='250' rx='6' fill='#0B6FC4'/><text x='660.0' y='210' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='#12263A' text-anchor='start'>2  Register</text><text x='660.0' y='270.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>One row per study, with</text><text x='660.0' y='311.6' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>its own wording and rate</text><rect x='60.0' y='420' width='520.0' height='250' rx='16' fill='#FFFFFF' stroke='#B9CBDD' stroke-width='3'/><rect x='60.0' y='420' width='12' height='250' rx='6' fill='#0B6FC4'/><text x='100.0' y='490' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='#12263A' text-anchor='start'>3  Check</text><text x='100.0' y='550.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>Against the source</text><text x='100.0' y='591.6' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>document, then graded</text><rect x='620.0' y='420' width='520.0' height='250' rx='16' fill='#FFFFFF' stroke='#B9CBDD' stroke-width='3'/><rect x='620.0' y='420' width='12' height='250' rx='6' fill='#B7791F'/><text x='660.0' y='490' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='#12263A' text-anchor='start'>4  Publish</text><text x='660.0' y='550.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>Annual report and decision</text><text x='660.0' y='591.6' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='32' font-weight='400' fill='#4A6076' text-anchor='start'>brief</text><text x='60' y='740.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='30' font-weight='400' fill='#4A6076' text-anchor='start'>Employment rates are never pooled across studies.</text></svg>